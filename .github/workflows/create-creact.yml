name: create-creact

permissions:
  contents: read

on:
  pull_request:
    branches:
      - master
    paths:
      - "packages/create-creact/**"
      - ".github/workflows/create-creact.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run the offline plan tests
        run: mise run test:cli

  scaffold:
    name: Scaffold ${{ matrix.stack }} + ${{ matrix.styling }} with ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        stack: [react-router, next]
        styling: [tailwind, stylex]
        toolchain: [standalone, vite-plus]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Scaffold, build, lint and test a project
        run: mise run test:scaffold
        env:
          CREACT_SCAFFOLD: ${{ matrix.toolchain }}:${{ matrix.stack }}:${{ matrix.styling }}
